name: Daily Tech Jobs Automation

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 gspread google-auth google-genai playwright
        playwright install chromium

    - name: Run Scraper and Analyzer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        USER_CONFIG_JSON: ${{ secrets.USER_CONFIG_JSON }}
        SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
      run: python scraper.py

    - name: Send Daily Report Email
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
      run: python email_sender.py