name: Daily Tech Jobs Automation

on:
  schedule:
    # Runs everyday at 09:00 AM UTC (06:00 AM Brasília Time)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub website

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/actions-setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 gspread google-auth google-genai playwright
        playwright install chromium

    - name: Run Scraper and Analyzer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: python scraper.py

    - name: Send Daily Report Email
      env:
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: python email_sender.py
